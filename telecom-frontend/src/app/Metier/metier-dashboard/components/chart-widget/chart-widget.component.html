<div class="chart-widget" [style.height]="height">
  <div class="chart-widget-header" *ngIf="title">
    <h3><i class="fas fa-chart-pie" *ngIf="type === 'doughnut'"></i><i class="fas fa-chart-bar" *ngIf="type === 'bar'"></i><i class="fas fa-chart-line" *ngIf="type === 'line'"></i>{{ title }}</h3>
    <span class="chart-subtitle" *ngIf="subtitle">{{ subtitle }}</span>
  </div>
  <div class="chart-canvas-wrap">
    <canvas #chartCanvas></canvas>
  </div>
</div>
