<div class="metier-dashboard" *ngIf="state$ | async as state">

  <app-dashboard-header
    title="Métier Tableau de bord"
    subtitle="Suivi de vos demandes et tickets"
    (primaryAction)="goToCreateTicket()"
    (secondaryAction)="goToMyTickets()">
  </app-dashboard-header>

  <app-filter-panel
    *ngIf="filters$ | async as filters"
    [filters]="filters"
    (filterChange)="onFilterChange($event)">
  </app-filter-panel>

  <div class="loading-shimmer" *ngIf="state.isLoading"></div>

  <div class="sla-banner" *ngIf="state.slaMetrics.breachedCount > 0 && !state.isLoading">
    <div class="sla-banner-icon"><i class="fas fa-exclamation-triangle"></i></div>
    <div class="sla-banner-text">
      <strong>{{ state.slaMetrics.breachedCount }} ticket{{ state.slaMetrics.breachedCount > 1 ? 's' : '' }}</strong>
      <span>en dépassement SLA</span>
    </div>
    <button class="sla-banner-btn" (click)="goToMyTickets()">Voir</button>
  </div>
  <div *ngIf="state.isLoading">
    <div class="kpi-grid">
      <app-skeleton-loader type="kpi" [count]="6"></app-skeleton-loader>
    </div>
    <div class="dash-row">
      <app-skeleton-loader type="chart" [count]="2"></app-skeleton-loader>
    </div>
    <div class="dash-row dash-row--asym">
      <app-skeleton-loader type="chart"></app-skeleton-loader>
      <app-skeleton-loader type="card"></app-skeleton-loader>
    </div>
  </div>

  <ng-container *ngIf="!state.isLoading">
    <div class="kpi-grid">
      <app-kpi-card *ngFor="let kpi of kpiCards; trackBy: trackByLabel"
        [data]="kpi" [clickable]="kpi.label === 'Total'"
        (clicked)="goToMyTickets()">
      </app-kpi-card>
    </div>

    <div class="dash-row">
      <div class="dash-card">
        <app-chart-widget
          type="doughnut"
          title="Répartition par statut"
          [labels]="getStatusLabels()"
          [data]="getStatusChartData(state)"
          [colors]="statusColors"
          [showLegend]="true">
        </app-chart-widget>
      </div>
      <div class="dash-card">
        <app-chart-widget
          type="bar"
          title="Tickets par priorité"
          [labels]="getPriorityLabels()"
          [data]="getPriorityChartData(state)"
          [colors]="priorityColors"
          [showLegend]="false">
        </app-chart-widget>
      </div>
    </div>

    <div class="dash-row dash-row--asym">
      <div class="dash-card dash-card--wide">
        <app-chart-widget
          type="line"
          title="Évolution des tickets"
          subtitle="8 dernières semaines"
          [labels]="state.trendData.labels"
          [data]="state.trendData.values"
          [colors]="trendColors"
          [showLegend]="false">
        </app-chart-widget>
      </div>
      <div class="dash-card">
        <div class="dash-card-head">
          <h3><i class="fas fa-tachometer-alt"></i> Performance</h3>
        </div>
        <app-sla-gauge [metrics]="state.slaMetrics"></app-sla-gauge>
      </div>
    </div>

    <div class="dash-row dash-row--dual" *ngIf="state.urgentTickets.length > 0 || state.recentTickets.length > 0">
      <app-ticket-list-widget
        *ngIf="state.urgentTickets.length > 0"
        [tickets]="state.urgentTickets"
        title="Tickets urgents"
        icon="fas fa-fire"
        variant="urgent"
        (ticketClick)="goToMyTickets()">
      </app-ticket-list-widget>

      <app-ticket-list-widget
        [tickets]="state.recentTickets"
        title="Tickets récents"
        icon="fas fa-clock"
        variant="default">
      </app-ticket-list-widget>
    </div>

    <div class="dash-empty" *ngIf="state.totalTickets === 0">
      <div class="dash-empty-icon"><i class="fas fa-inbox"></i></div>
      <h3>Aucun ticket</h3>
      <p>Créez votre premier ticket pour commencer</p>
      <button class="btn-pill btn-primary" (click)="goToCreateTicket()">
        <i class="fas fa-plus"></i> Créer un ticket
      </button>
    </div>
  </ng-container>
</div>
