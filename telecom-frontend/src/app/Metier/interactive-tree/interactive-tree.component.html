<div class="chat-shell">

  <!-- ══════════ HEADER ══════════ -->
  <header class="chat-header">
    <div class="header-left">
      <div class="agent-avatar">
        <i class="fas fa-robot"></i>
        <span class="status-dot"></span>
      </div>
      <div class="header-meta">
        <h3>Assistant Diagnostic IT</h3>
        <span class="sub">Technicien N1 · Certifié ITIL v4</span>
      </div>
    </div>
    <div class="header-right">
      <span class="badge-live" *ngIf="!isResolved">
        <i class="fas fa-circle"></i> EN LIGNE
      </span>
      <span class="badge-resolved" *ngIf="isResolved">
        <i class="fas fa-check-circle"></i> RÉSOLU
      </span>
    </div>
  </header>

  <!-- ══════════ BODY ══════════ -->
  <div class="chat-body" #scrollMe>

    <div *ngFor="let msg of messages; trackBy: trackByIndex"
         class="msg-row"
         [class.msg-row--user]="msg.sender === 'USER'"
         [class.msg-row--ia]="msg.sender === 'IA'"
         [class.msg-row--system]="msg.sender === 'SYSTEM'">

      <!-- Avatar IA -->
      <div class="avatar avatar--ia" *ngIf="msg.sender === 'IA'">
        <i class="fas fa-robot"></i>
      </div>

      <!-- Bulle -->
      <div class="bubble-wrap">
        <div class="bubble">{{ msg.text }}</div>
        <div class="timestamp">
          {{ msg.timestamp | date:'HH:mm' }}
        </div>
      </div>

      <!-- Avatar User -->
      <div class="avatar avatar--user" *ngIf="msg.sender === 'USER'">
        <i class="fas fa-user"></i>
      </div>
    </div>

    <!-- ── Typing Indicator ── -->
    <div class="msg-row msg-row--ia" *ngIf="isAiTyping">
      <div class="avatar avatar--ia">
        <i class="fas fa-robot"></i>
      </div>
      <div class="bubble-wrap">
        <div class="bubble bubble--typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- ── Options Buttons ── -->
    <div class="options-area" *ngIf="currentOptions.length > 0 && !isAiTyping">
      <button
        *ngFor="let opt of currentOptions"
        class="opt-btn"
        (click)="selectOption(opt)">
        {{ opt }}
      </button>
    </div>

  </div><!-- /chat-body -->

  <!-- ══════════ FOOTER ══════════ -->
  <footer class="chat-footer" *ngIf="!isResolved">
    <div class="input-row" [class.input-row--disabled]="isAiTyping">
      <input
        type="text"
        [(ngModel)]="userInput"
        (keyup.enter)="submitText()"
        placeholder="Ou décrivez votre problème librement…"
        [disabled]="isAiTyping"
        class="chat-input"
        autocomplete="off" />
      <button
        class="send-btn"
        (click)="submitText()"
        [disabled]="isAiTyping || !userInput.trim()">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
    <div class="footer-hint" *ngIf="currentOptions.length > 0">
      <i class="fas fa-hand-pointer"></i> Sélectionnez une option pour continuer
    </div>
  </footer>

</div>
