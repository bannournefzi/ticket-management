<nav class="navbar">

  <!-- Left: breadcrumb-style page context -->
  <div class="navbar-left">
    <span class="nav-greeting">Bonjour, <strong>{{ userName }}</strong></span>
  </div>

  <!-- Right: actions -->
  <div class="navbar-right">

    <!-- Notifications -->
    <div class="notification-wrapper">
      <button class="icon-btn" (click)="toggleNotifications($event)" [class.active]="isNotificationsOpen" aria-label="Notifications">
        <i class="fas fa-bell"></i>
        <span class="count-badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
      </button>

      <div class="dropdown-panel notif-panel" *ngIf="isNotificationsOpen" [@dropdownAnimation]>
        <div class="panel-header">
          <span class="panel-title">Notifications</span>
          <div class="panel-actions">
            <button class="text-btn" (click)="markAllAsRead()" *ngIf="unreadCount > 0">Tout marquer comme lu</button>
            <button class="text-btn test-btn" (click)="sendTestNotification()" title="Send test notification">
              <i class="fas fa-flask"></i> Test
            </button>
          </div>
        </div>

        <div class="notif-list" *ngIf="notifications.length > 0; else emptyNotif">
          <div class="notif-item" *ngFor="let notif of notifications" [class.unread]="!notif.read"
               (click)="markAsRead(notif.id)">
            <div class="notif-icon" [style.background]="getNotifBg(notif.type)" [style.color]="getNotifColor(notif.type)">
              <i class="fas" [ngClass]="getNotifIcon(notif.type)"></i>
            </div>
            <div class="notif-body">
              <span class="notif-title">{{ notif.title }}</span>
              <span class="notif-msg">{{ notif.message }}</span>
              <span class="notif-time">{{ getTimeAgo(notif.createdAt) }}</span>
            </div>
            <button class="notif-close" (click)="removeNotification(notif.id); $event.stopPropagation()">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>

        <ng-template #emptyNotif>
          <div class="panel-footer">
            <div class="empty-icon"><i class="far fa-bell"></i></div>
            <span class="empty-text">Aucune notification</span>
          </div>
        </ng-template>
      </div>
    </div>

    <!-- Messages -->
    <button class="icon-btn" (click)="goToChat()" aria-label="Messages">
      <i class="fas fa-comment-dots"></i>
    </button>

    <!-- User -->
    <div class="user-menu-wrapper">
      <button class="user-btn" (click)="toggleDropdown($event)" [class.active]="isDropdownOpen">
        <div class="user-avatar-sm">
          <img *ngIf="avatarPhoto" [src]="avatarPhoto" class="avatar-img" alt="" (error)="onAvatarError()"/>
          <span *ngIf="!avatarPhoto">{{ getUserInitials() }}</span>
        </div>
        <i class="fas fa-chevron-down chevron" [class.open]="isDropdownOpen"></i>
      </button>

      <div class="dropdown-panel user-panel" *ngIf="isDropdownOpen" [@dropdownAnimation]>
        <div class="user-panel-header">
          <div class="user-avatar-lg">
            <img *ngIf="avatarPhoto" [src]="avatarPhoto" class="avatar-img" alt="" (error)="onAvatarError()"/>
            <span *ngIf="!avatarPhoto">{{ getUserInitials() }}</span>
          </div>
          <div class="user-panel-info">
            <span class="user-panel-name">{{ userName }}</span>
            <span class="user-panel-email">{{ getEmail() }}</span>
            <span class="user-panel-role">{{ getUserRole() }}</span>
          </div>
        </div>
        <div class="panel-divider"></div>
        <div class="panel-menu">
          <button class="panel-item" (click)="goToProfile()">
            <i class="fas fa-user"></i>
            <span>Mon Profil</span>
          </button>
          <a routerLink="/business-analyst/settings" routerLinkActive="active" class="panel-item" (click)="closeDropdown()">
            <i class="fas fa-cog"></i>
            <span>Paramètres</span>
          </a>
        </div>
        <div class="panel-divider"></div>
        <div class="panel-menu">
          <button class="panel-item item-danger" (click)="logout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Déconnexion</span>
          </button>
        </div>
      </div>
    </div>

  </div>

</nav>

<div class="click-away" *ngIf="isDropdownOpen || isNotificationsOpen" (click)="closeAll()"></div>
