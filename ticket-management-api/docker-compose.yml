version: "3.8"

services:
  backend:
    container_name: ticket-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/Telecom
      SPRING_DATASOURCE_USERNAME: bannournefzi
      SPRING_DATASOURCE_PASSWORD: bannour123
    restart: unless-stopped
    networks:
      - spring-demo

networks:
  spring-demo:
    driver: bridge