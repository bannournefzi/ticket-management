spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2:3b
        enabled: true
        options:
          num-predict: 1024
          temperature: 0.7
          top-p: 0.9
      embedding:
        model: nomic-embed-text
        enabled: true
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
        distance-type: COSINE_DISTANCE

# Voice-to-Ticket AI config
ollama:
  base-url: http://localhost:11434
  model: llama3.2:3b

pgvector:
  datasource:
    url: jdbc:postgresql://localhost:5433/Telecom
    username: postgres
    password: postgres

springdoc:
  default-produces-media-type: application/json

server:
  servlet:
    context-path: /api/v1/