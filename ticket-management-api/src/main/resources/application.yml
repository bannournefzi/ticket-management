spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2:3b
        enabled: ${OLLAMA_ENABLED:true}
        options:
          num-predict: 1024
          temperature: 0.7
          top-p: 0.9
      embedding:
        model: nomic-embed-text
        enabled: ${OLLAMA_ENABLED:true}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
        distance-type: COSINE_DISTANCE

# Voice-to-Ticket AI config
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: llama3.2:3b

pgvector:
  datasource:
    url: ${PGVECTOR_URL:jdbc:postgresql://localhost:5433/Telecom}
    username: ${PGVECTOR_USERNAME:postgres}
    password: ${PGVECTOR_PASSWORD:postgres}

springdoc:
  default-produces-media-type: application/json

server:
  servlet:
    context-path: /api/v1/

application:
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:4200}

logging:
  level:
    tn.esprit.ticketmanagement.mantis: WARN