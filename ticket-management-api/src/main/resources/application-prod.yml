spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2:3b
        enabled: false
        options:
          num-predict: 1024
          temperature: 0.7
          top-p: 0.9
      embedding:
        model: nomic-embed-text
        enabled: false
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
        distance-type: COSINE_DISTANCE

pgvector:
  datasource:
    url: ${PGVECTOR_URL:${spring.datasource.url}}
    username: ${PGVECTOR_USERNAME:${spring.datasource.username}}
    password: ${PGVECTOR_PASSWORD:${spring.datasource.password}}

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${JWT_ISSUER_URI:https://ticket-management-backend-cmg7aahyfpb9due6.francecentral-01.azurewebsites.net}
        jwk-set-uri: ${JWT_ISSUER_URI:https://ticket-management-backend-cmg7aahyfpb9due6.francecentral-01.azurewebsites.net}/.well-known/jwks.json

application:
  mailing:
    frontend:
      activation-url: ${FRONTEND_ACTIVATION_URL:https://telecom-frontend-grfzbfhdh6dpa6dh.francecentral-01.azurewebsites.net/activate-account}
  websocket:
      allowed-origins: ${FRONTEND_ORIGIN:https://telecom-frontend-grfzbfhdh6dpa6dh.francecentral-01.azurewebsites.net}

logging:
  level:
    tn.esprit.ticketmanagement.mantis: WARN
    org.hibernate.SQL: WARN