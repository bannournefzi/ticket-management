name: CI/CD – Ticket Management Backend

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Build
  # ══════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build (skip tests)
        run: mvn -B package -DskipTests
        working-directory: ticket-management-api

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ticket-management-api/target/*.jar
          retention-days: 1

  # ══════════════════════════════════════════════
  # JOB 2 — Tests Unitaires + Couverture JaCoCo
  # ══════════════════════════════════════════════
  test:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    needs: build

    env:
      SPRING_PROFILES_ACTIVE: test
      OLLAMA_BASE_URL: http://localhost:11434

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests & Coverage
        run: mvn -B test jacoco:report -e -Dspring.profiles.active=test
        working-directory: ticket-management-api
        continue-on-error: true

      - name: Afficher les erreurs de tests
        if: always()
        run: |
          echo "=== SUREFIRE REPORTS ==="
          find ticket-management-api/target/surefire-reports/ -name "*.txt" -exec cat {} \; 2>/dev/null || echo "Aucun rapport trouvé"
          echo "=== TESTS ÉCHOUÉS ==="
          grep -r "FAILED\|ERROR\|Exception" ticket-management-api/target/surefire-reports/ 2>/dev/null || echo "Aucune erreur"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            ticket-management-api/target/surefire-reports/
            ticket-management-api/target/site/jacoco/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 3a — OWASP Dependency-Check (parallèle)
  # ══════════════════════════════════════════════
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache base NVD
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: ${{ runner.os }}-nvd-v12-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-nvd-v12-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=11 \
            -DsuppressionFile=../.github/owasp-suppressions.xml \
            -DnvdApiKey=${NVD_API_KEY} \
            -Dformats=HTML,JSON,SARIF 2>&1 | tee /tmp/owasp.log || true
        working-directory: ticket-management-api

      - name: Upload log OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-maven-log
          path: /tmp/owasp.log
          retention-days: 3

      - name: Upload rapports OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: ticket-management-api/target/
          if-no-files-found: warn
          retention-days: 14

      - name: Corriger le SARIF
        if: always() && hashFiles('ticket-management-api/target/dependency-check-report.sarif') != ''
        run: |
          python3 - <<'EOF'
          import json
          sarif_path = "ticket-management-api/target/dependency-check-report.sarif"
          with open(sarif_path, "r", encoding="utf-8") as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              for rule in driver.get("rules", []):
                  if len(rule.get("id", "")) > 255:
                      rule["id"] = rule["id"][:255]
              for result in run.get("results", []):
                  if len(result.get("ruleId", "")) > 255:
                      result["ruleId"] = result["ruleId"][:255]
          with open(sarif_path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)
          print("SARIF corrigé avec succès.")
          EOF

      - name: Upload SARIF → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('ticket-management-api/target/dependency-check-report.sarif') != ''
        with:
          sarif_file: ticket-management-api/target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Résumé OWASP
        if: always()
        run: |
          echo "## OWASP Dependency-Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ticket-management-api/target/dependency-check-report.html ]; then
            CRITICAL=$(grep -o 'cvss[^"]*">[0-9]\+\.[0-9]\+' /tmp/owasp.log \
              | awk -F'>' '{if($2+0>=9) count++} END{print count+0}')
            HIGH=$(grep -o 'cvss[^"]*">[0-9]\+\.[0-9]\+' /tmp/owasp.log \
              | awk -F'>' '{if($2+0>=7 && $2+0<9) count++} END{print count+0}')
            echo "| Sévérité | Nombre |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| CRITICAL (>= 9) | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| HIGH (7-9) | ${HIGH} |" >> $GITHUB_STEP_SUMMARY
            echo "Rapport complet dans **Artifacts → owasp-report**" >> $GITHUB_STEP_SUMMARY
          else
            echo ":warning: Rapport non généré — voir **owasp-maven-log**." >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════
  # JOB 3b — SonarCloud Analysis (parallèle)
  # ══════════════════════════════════════════════
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Récupérer les rapports de tests
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: ticket-management-api/target/

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B test jacoco:report sonar:sonar \
            -Dsonar.projectKey=bannournefzi_ticket-management \
            -Dsonar.organization=bannournefzi \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dspring.profiles.active=test
        working-directory: ticket-management-api

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          scanMetadataReportFile: ticket-management-api/target/sonar/report-task.txt

  # ══════════════════════════════════════════════
  # JOB 4 — Docker Build & Push → Docker Hub
  # ══════════════════════════════════════════════
  docker:
    name: Docker Build & Push → Hub
    runs-on: ubuntu-latest
    needs: [ sonar, owasp ]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build JAR pour Docker
        run: mvn -B package -DskipTests
        working-directory: ticket-management-api

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ticket-management-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and Push → Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./ticket-management-api
          file: ./ticket-management-api/docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé Docker
        run: |
          echo "## Docker Build & Push" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ secrets.DOCKERHUB_USERNAME }}/ticket-management-backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════
  # JOB 5 — Deploy → Render.com (optionnel)
  # ══════════════════════════════════════════════
