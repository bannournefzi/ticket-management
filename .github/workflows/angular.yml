name: CI/CD – Telecom Frontend

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Lint
  # ══════════════════════════════════════════════
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: telecom-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: telecom-frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: telecom-frontend

  # ══════════════════════════════════════════════
  # JOB 2 — Tests Unitaires
  # ══════════════════════════════════════════════
  test:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: telecom-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: telecom-frontend

      - name: Run Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: telecom-frontend

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: telecom-frontend/coverage/
          retention-days: 7